[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qca-schrodinger-cms"
version = "0.1.0"
description = "Constrained Schrödinger OT calibration for CMS rate derivatives"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*", "exp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
